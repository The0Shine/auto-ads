server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy optimizer API → ai-optimizer:8000
    location /api/v1/optimizer {
        proxy_pass http://ai-optimizer:8000/optimizer;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # Proxy MinIO images → same origin (avoids browser cross-origin issues)
    # URL pattern: /files/autoads-creatives/<key> → minio:9000/autoads-creatives/<key>
    location /files/autoads-creatives/ {
        proxy_pass http://minio:9000/autoads-creatives/;
        proxy_set_header Host minio:9000;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Proxy all other API calls → api-gateway:3000
    location /api {
        proxy_pass http://api-gateway:3000/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
